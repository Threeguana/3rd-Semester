<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hello World JavaScript</title>

    <script>
        // JavaScript code inside the head tag
        console.log("Hello JS from the Head");
    </script>
</head>
<body>
    <p>JavaScript tutorial for beginners</p>

    <!-- Trigger an alert when the link is clicked -->
    <a href="#" onclick="alert('Yay!')">Click here!</a>
    <br>

    <!-- Using javascript: inside the href attribute -->
    <a href="javascript:alert('Yay!')">Click here!</a>

    <script>
        // JavaScript code inside the body tag
        console.log("Hello JS from the Body");
    </script>
</body>
</html>
