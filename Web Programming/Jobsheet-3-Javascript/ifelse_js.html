<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>If Else Statement</title>
</head>
<body>
    <script>
        const pw = prompt("Password:");

        if (pw === "teh") {
            document.write("<h2>Welcome!</h2>");
        } else {
            document.write("<p>Incorrect password.</p>");
        }

        document.write("<p>Thank you for using this application.</p>");
    </script>
</body>
</html>
