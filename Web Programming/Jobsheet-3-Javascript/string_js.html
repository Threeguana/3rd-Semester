<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Strings</title>
</head>
<body>
    <h2>JavaScript Strings</h2>
    <p>Creating JavaScript strings</p>
    <p id="demo"></p>

    <script>
        const answer1 = "It's alright";
        const answer2 = "He is called 'Dilan'";
        const answer3 = 'He is called "Dilan"';

        document.getElementById("demo").innerHTML =
            `${answer1}<br>${answer2}<br>${answer3}`;
    </script>
</body>
</html>
