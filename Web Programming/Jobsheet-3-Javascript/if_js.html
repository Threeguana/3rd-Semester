<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>If Statement Example</title>
</head>
<body>
    <script>
        const totalPurchase = prompt("Total purchase amount?", 0);

        if (totalPurchase > 30000) {
            document.write("<h2>Congratulations! You received a gift.</h2>");
        }

        document.write("<p>Thank you for shopping at our store.</p>");
    </script>
</body>
</html>
