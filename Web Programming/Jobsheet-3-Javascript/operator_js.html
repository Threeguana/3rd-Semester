<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Operators</title>
</head>
<body>
    <h2>JavaScript Operators</h2>
    <p>x = 5, y = 2, calculating z = x + y, and displaying z:</p>
    <p id="demo"></p>

    <script>
        const x = 5;
        const y = 2;
        const z = x + y;

        document.getElementById("demo").textContent = z;
    </script>
</body>
</html>
