<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Data Types</title>
</head>
<body>
    <h2>JavaScript Data Types</h2>
    <p>Example of JavaScript data types:</p>
    <p id="demo"></p>

    <script>
        let x; // x is undefined
        x = 5; // x is a number
        x = "John"; // x is a string

        document.getElementById("demo").textContent = x;
    </script>
</body>
</html>
