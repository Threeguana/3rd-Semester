<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Dialog</title>
</head>
<body>
    <script>
        const confirmVisit = confirm("Are you sure you want to visit Polinema?");

        if (confirmVisit) {
            window.location.href = "https://www.polinema.ac.id";
        } else {
            document.write("Alright, staying here then.");
        }
    </script>
</body>
</html>
