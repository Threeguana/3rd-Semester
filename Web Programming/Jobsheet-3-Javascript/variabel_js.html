<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Learning Variables in JavaScript</title>
    <script>
        // Create variables
        const siteName = "JavaScript";
        const visitorCount = 50322;
        const isActive = true;

        // Display variable in an alert dialog
        alert("Welcome to " + siteName);

        // Display variables in the HTML
        document.write(`Site name: ${siteName}<br>`);
        document.write(`Number of visitors: ${visitorCount}<br>`);
        document.write(`Active status: ${isActive}<br>`);
    </script>
</head>
<body>
</body>
</html>
