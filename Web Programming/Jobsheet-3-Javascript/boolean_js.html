<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Boolean</title>
</head>
<body>
    <h2>JavaScript Boolean</h2>
    <p>A boolean only has two values: true and false.</p>
    <p id="demo"></p>

    <script>
        const x = 5;
        const y = 5;
        const z = 6;

        document.getElementById("demo").innerHTML =
            (x === y) + "<br>" + (x === z);
    </script>
</body>
</html>
