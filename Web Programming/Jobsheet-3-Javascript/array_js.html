<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Arrays</title>
</head>
<body>
    <h2>JavaScript Arrays</h2>
    <p>Array example:</p>
    <p id="demo"></p>

    <script>
        const cars = ["one", "two", "three"];
        document.getElementById("demo").textContent = cars[0];
    </script>
</body>
</html>
