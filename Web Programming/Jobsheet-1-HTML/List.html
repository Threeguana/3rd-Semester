<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Working With Lists</title>
    </head>
    <body>
        ordered list
        <ol>
            <li>one</li>
            <li>two</li>
            <li>three</li>
        </ol>
        <br />
        <hr />

        unordered list
        <ul>
            <li>one</li>
            <li>two</li>
            <li>three</li>
        </ul>
        <br />
        <hr />

        definition list
        <dl>
            <dt>one</dt>
            <dd>one one</dd>
            <dd>one two</dd>
            <dt>two</dt>
            <dd>two two</dd>
        </dl>
    </body>
</html>
