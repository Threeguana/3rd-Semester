<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Font Formatting</title>
    </head>
    <body>
        <b>using tag &lt;b&gt;</b><br />
        <strong>using tag &lt;strong&gt;</strong>
        <br />
        <i>using tag &lt;i&gt;</i>
        <br />
        <em>using tag &lt;em&gt;</em>
        <br />
        <u>using tag &lt;u&gt;</u>
        <br />
        <strike>using tag &lt;strike&gt;</strike>
    </body>
</html>
