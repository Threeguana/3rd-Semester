<html>
    <head>
        <title>Create Table</title>
    </head>
    <body>
        <table border="1" height="100%" width="40%" cellpadding="20" cellspacing="5">
            <tr>
                <td rowspan="2" align="right" valign="bottom">
                    <font face="courier">this is row one column one</font>
                </td>
                <td>this is row one column two</td>
                <td>this is row one column three</td>
            </tr>
            <tr>
                <td>this is row two column one</td>
                <td colspan="2">this is now a merge of 2 columns</td>
            </tr>
        </table>
    </body>
</html>
